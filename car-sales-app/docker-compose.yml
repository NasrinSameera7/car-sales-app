version: "3.8"
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: carsales
      POSTGRES_PASSWORD: carsales
      POSTGRES_DB: carsales
    ports:
      - "5432:5432"
    volumes:
      - car_sales_db_data:/var/lib/postgresql/data

volumes:
  car_sales_db_data:
